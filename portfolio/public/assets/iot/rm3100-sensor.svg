<svg xmlns="http://www.w3.org/2000/svg" viewBox="38 18 224 172" width="224" height="172" role="img" aria-label="PNI RM3100 3-axis magnetometer breakout board — Fritzing-style">
  <style>
    .pcb { fill:#1e3a8a; stroke:#12235c; stroke-width:1.4; }
    .pcb-edge { fill:#16307a; }
    .copper { fill:#c9a227; stroke:#8a6f16; stroke-width:0.7; }
    .pcb-trace { fill:none; stroke:#0c1b46; stroke-width:1; }
    .silkscreen { font-family:monospace; fill:#dbeafe; }
    .chip { fill:#0f172a; stroke:#3d4b5c; stroke-width:1; }
    .coil { fill:#7c2d12; stroke:#451a03; stroke-width:0.9; }
  </style>

  <!-- board -->
  <rect class="pcb" x="40" y="30" width="220" height="140" rx="5"/>
  <rect class="pcb-edge" x="40" y="30" width="220" height="6" rx="3"/>

  <!-- copper traces -->
  <path class="pcb-trace" d="M120 92 H150 V70 H196"/>
  <path class="pcb-trace" d="M120 112 H150 V134 H196"/>
  <path class="pcb-trace" d="M180 82 V92 H196"/>
  <path class="pcb-trace" d="M70 110 H100 V92 H120"/>

  <!-- SEN-XY sensor coils (two) -->
  <g>
    <rect class="coil" x="78" y="52" width="40" height="30" rx="3"/>
    <rect x="84" y="58" width="28" height="18" rx="2" fill="#0f172a" stroke="#451a03" stroke-width="0.7"/>
    <text class="silkscreen" x="98" y="70" font-size="5.5" text-anchor="middle" fill="#fdba74">XY</text>
    <text class="silkscreen" x="98" y="48" font-size="4.4" text-anchor="middle">Sen-XY-f</text>
  </g>
  <g>
    <rect class="coil" x="78" y="118" width="40" height="30" rx="3"/>
    <rect x="84" y="124" width="28" height="18" rx="2" fill="#0f172a" stroke="#451a03" stroke-width="0.7"/>
    <text class="silkscreen" x="98" y="136" font-size="5.5" text-anchor="middle" fill="#fdba74">XY</text>
    <text class="silkscreen" x="98" y="156" font-size="4.4" text-anchor="middle">Sen-XY-f</text>
  </g>

  <!-- SEN-Z sensor coil (vertical) -->
  <g>
    <rect class="coil" x="134" y="60" width="30" height="40" rx="3"/>
    <rect x="140" y="66" width="18" height="28" rx="2" fill="#0f172a" stroke="#451a03" stroke-width="0.7"/>
    <text class="silkscreen" x="149" y="86" font-size="5.5" text-anchor="middle" fill="#fdba74">Z</text>
    <text class="silkscreen" x="149" y="56" font-size="4.4" text-anchor="middle">Sen-Z-f</text>
  </g>

  <!-- MagI2C ASIC controller -->
  <rect class="chip" x="180" y="80" width="34" height="34" rx="3"/>
  <text class="silkscreen" x="197" y="96" font-size="4.4" text-anchor="middle" fill="#8ad7ff">MagI2C</text>
  <text class="silkscreen" x="197" y="104" font-size="3.6" text-anchor="middle" fill="#8ad7ff">ASIC</text>
  <!-- ASIC pins -->
  <g fill="#c9a227">
    <rect x="177" y="85" width="4" height="3"/><rect x="177" y="93" width="4" height="3"/><rect x="177" y="101" width="4" height="3"/>
    <rect x="213" y="85" width="4" height="3"/><rect x="213" y="93" width="4" height="3"/><rect x="213" y="101" width="4" height="3"/>
  </g>

  <!-- header pins (bottom edge) — I2C/SPI breakout -->
  <g>
    <rect class="copper" x="56" y="164" width="188" height="12" rx="1.5"/>
    <g fill="#2a2410">
      <rect x="66" y="167.5" width="5" height="7"/><rect x="86" y="167.5" width="5" height="7"/>
      <rect x="106" y="167.5" width="5" height="7"/><rect x="126" y="167.5" width="5" height="7"/>
      <rect x="146" y="167.5" width="5" height="7"/><rect x="166" y="167.5" width="5" height="7"/>
      <rect x="186" y="167.5" width="5" height="7"/><rect x="206" y="167.5" width="5" height="7"/>
      <rect x="226" y="167.5" width="5" height="7"/>
    </g>
  </g>
  <!-- pin labels -->
  <text class="silkscreen" x="68.5" y="186" font-size="3.4" text-anchor="middle">VCC</text>
  <text class="silkscreen" x="88.5" y="186" font-size="3.4" text-anchor="middle">GND</text>
  <text class="silkscreen" x="108.5" y="186" font-size="3.4" text-anchor="middle">SCL</text>
  <text class="silkscreen" x="128.5" y="186" font-size="3.4" text-anchor="middle">SDA</text>
  <text class="silkscreen" x="148.5" y="186" font-size="3.4" text-anchor="middle">SCLK</text>
  <text class="silkscreen" x="168.5" y="186" font-size="3.4" text-anchor="middle">MISO</text>
  <text class="silkscreen" x="188.5" y="186" font-size="3.4" text-anchor="middle">MOSI</text>
  <text class="silkscreen" x="208.5" y="186" font-size="3.4" text-anchor="middle">CS</text>
  <text class="silkscreen" x="228.5" y="186" font-size="3.4" text-anchor="middle">DRDY</text>

  <!-- title + vendor -->
  <text class="silkscreen" x="150" y="26" font-size="7" text-anchor="middle" font-weight="bold">RM3100</text>
  <text class="silkscreen" x="150" y="40" font-size="4.6" text-anchor="middle" fill="#8ad7ff">3-AXIS MAGNETOMETER · PNI SENSOR</text>

  <!-- mounting holes -->
  <circle cx="52" cy="42" r="3" fill="#0a1430"/>
  <circle cx="248" cy="42" r="3" fill="#0a1430"/>
  <circle cx="52" cy="158" r="3" fill="#0a1430"/>
  <circle cx="248" cy="158" r="3" fill="#0a1430"/>

  <!-- I2C/SPI badge -->
  <text class="silkscreen" x="150" y="100" font-size="3.8" text-anchor="middle" fill="#22c55e">I2C / SPI</text>
</svg>
